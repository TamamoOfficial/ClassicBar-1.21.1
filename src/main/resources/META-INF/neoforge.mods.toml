modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# ParCool's stamina bar replaces ParCool's own HUD when its HUD type is Light.
[[dependencies.${mod_id}]]
modId = "parcool"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

# Tough as Nails' thirst bar.
[[dependencies.${mod_id}]]
modId = "toughasnails"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"
